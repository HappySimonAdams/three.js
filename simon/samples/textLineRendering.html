<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
	<title>字体线形渲染</title>
	<link type="text/css" rel="stylesheet" href="../../examples/main.css">
</head>
<body>
	<script type="importmap">
		{
			"imports": {
				"three": "../../src/Three.js",
				"three/addons/": "../../examples/jsm/"
			}
		}
	</script>

	<script type="module">
		import {
			AxesHelper,
			BufferGeometry,
			BufferAttribute,
			CubicBezierCurve3,
			LineBasicMaterial,
			Line,
			LineSegments,
			PerspectiveCamera,
			QuadraticBezierCurve3,
			Scene,
			Vector3,
			WebGLRenderer,
		} from 'three';
		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import Stats from 'three/addons/libs/stats.module.js';
		import { SHXFontLoader, SHXFont } from './libs/loaders/SHXFontLoader.js';

		let renderer, scene, camera, controls, stats;
		let isDirty = true;
		let lastTime = performance.now();
		let font;
		let line;

		const width = window.innerWidth;
		const height = window.innerHeight;

		init();
		render();

		function init() {

			initViewer();
			initObjects();
			initGUI();

		}

		function initViewer() {

			camera = new PerspectiveCamera( 45, width / height, 0.1, 1000 );
			camera.position.set( 0, 10, 30 );

			scene = new Scene();
			scene.matrixAutoUpdate = false;
			/* NOTE: 场景中的所有物体需要手动调用 updateMatrixWorld() */
			// scene.matrixWorldAutoUpdate = false;

			const axes = new AxesHelper( 10 );
			axes.matrixAutoUpdate = false;
			scene.add( axes );

			renderer = new WebGLRenderer( { antialias: true } );
			renderer.setClearColor( 0x333333 );
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( width, height );
			renderer.domElement.style.touchAction = 'none';
			document.body.appendChild( renderer.domElement );

			controls = new OrbitControls( camera, renderer.domElement );
			controls.target.set( 0, 0, 0 );

			stats = new Stats();
			document.body.appendChild( stats.dom );

			controls.addEventListener( 'change', () => isDirty = true );
			window.addEventListener( 'resize', onWindowResize, false );

		}

		async function initObjects() {

			// const url = './assets/fonts/shx/1JADID.shx';
			// const url = './assets/fonts/shx/a5.shx';
			const url = './assets/fonts/shx/gbenor.shx';
			// const url = './assets/fonts/shx/tssdchn.shx';
			new SHXFontLoader().load( url, () => {

			}, undefined, ( err ) => console.error( '加载字体失败:', err ) );

			// const geometry = new BufferGeometry()
			// 	.setAttribute( 'position', new BufferAttribute( new Float32Array( positions ), 3 ) );

			// const material = new LineBasicMaterial( {
			// 	color: 0xff0000,
			// } );
			// line = new Line( geometry, material );
			// // line = new LineSegments( geometry, material );
			// scene.add( line );

			// isDirty = true;

		}

		function initGUI() {

			// const gui = new GUI();
			// const gui_options = {
			// };
			// gui.add( gui_options, '' );

		}

		function onWindowResize() {

			const w = window.innerWidth;
			const h = window.innerHeight;
			camera.aspect = w / h;
			camera.updateProjectionMatrix();
			renderer.setSize( w, h );
			isDirty = true;

		}

		function render() {

			requestAnimationFrame( render );

			const now = performance.now();
			if ( now - lastTime < 10 ) return;
			lastTime = now;

			stats.begin();

			if ( isDirty ) {

				isDirty = false;
				renderer.render( scene, camera );

			}

			stats.end();

		}

		window.renderer = renderer;
		window.scene = scene;
	</script>
</body>
</html>
